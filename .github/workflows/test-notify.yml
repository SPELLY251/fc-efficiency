# 알림 메일이 잘 오는지 확인하는 시험용 (실제 알림과 같은 봇 계정으로 이슈를 올린다)
name: 알림 메일 시험

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "[시험] 알림 메일 확인용 (봇)" \
            --body "현질효율판 자동 알림 시험이에요. 이 메일을 받으셨다면 '새 상품 확률표 필요' 알림도 같은 곳으로 와요."
